<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="GymFlow: dieta, treino e evolução em um só app.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymFlow">
<title>GymFlow · Dieta, Treino e Evolução</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Inter (SIL Open Font License, fontes/Inter-LICENCA-OFL.txt), embutida para funcionar offline */
@font-face{font-family:Inter;src:url(fontes/Inter.woff) format('woff');font-weight:100 900;font-display:swap}
:root{
  --bg:#000000; --card:#121214; --card2:#1a1a1d; --card3:#26262a; --line:#26262a; --borda:rgba(255,255,255,.06);
  --txt:#f5f5f7; --sub:#a1a1a6; --mut:#6e6e73;
  --ac:#00d084; --ac2:#00b371; --acbg:rgba(0,208,132,.14);
  --blue:#0a84ff; --bluebg:rgba(10,132,255,.15);
  --warn:#ffb020; --warnbg:rgba(255,176,32,.14);
  --red:#ff453a; --redbg:rgba(255,69,58,.14);
  --carb:#ffb020; --prot:#00d084; --gord:#bf5af2;
  --r:24px; --nav:68px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4;letter-spacing:-.01em;font-feature-settings:"tnum" 0;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.travado{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.campo{display:block;margin-bottom:12px}
label.campo>span{display:block;font-size:13px;color:var(--sub);margin:0 0 6px 2px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px} h4{font-size:15px}
a{color:var(--ac)}
.hidden{display:none!important}
.sub{color:var(--sub)} .mut{color:var(--mut)} .ac{color:var(--ac)} .red{color:var(--red)} .warn{color:var(--warn)} .blue{color:var(--blue)}
.small{font-size:13px} .tiny{font-size:11.5px} .b{font-weight:700} .c{text-align:center} .r{text-align:right}
.row{display:flex;align-items:center;gap:10px} .row.sb{justify-content:space-between} .row.top{align-items:flex-start} .wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.mt{margin-top:12px} .mt2{margin-top:20px} .mb{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* App shell */
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.topbar{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#00a3ff);color:#000;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.avatar.g{width:72px;height:72px;font-size:26px}
.topbar .ola{font-size:13.5px;color:var(--sub)} .topbar .nome{font-weight:800;font-size:21px;letter-spacing:-.025em}
.icone-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--borda);display:grid;place-items:center;color:var(--sub);background:var(--card)}
.icone-btn:active{transform:scale(.95)}
/* --- estilo novo: destaque com brilho, ícones coloridos, vidro --- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 18px;margin-bottom:14px;border:1px solid rgba(0,208,132,.35);
  background:radial-gradient(120% 90% at 100% 0%,rgba(0,208,132,.28),transparent 55%),linear-gradient(160deg,#0f2e23 0%,#0b1512 45%,#0b0d0e 100%);box-shadow:0 18px 50px -20px rgba(0,208,132,.45)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,208,132,.18),0 0 0 34px rgba(0,208,132,.025),0 0 0 35px rgba(0,208,132,.14),0 0 0 72px rgba(0,208,132,.02),0 0 0 73px rgba(0,208,132,.09)}
.hero>*{position:relative;z-index:1}
.hero .topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .rot{display:flex;align-items:center;gap:8px;color:#d6dbd8;font-size:14.5px;font-weight:500}
.hero .pilula{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;color:var(--txt)}
.hero .num{font-size:54px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:18px 0 4px}
.hero .num span{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#cfd6d2}
.hero .sub2{color:#9fb0a8;font-size:13.5px}
.hero .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8a9a93;margin:20px 0 10px;text-transform:uppercase}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini>div{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:12px 11px}
.mini .n{font-size:12.5px;color:#b8c2bd;margin-top:10px}
.mini .q{font-weight:800;font-size:16px;letter-spacing:-.02em;margin-top:2px}
.mini .q span{font-weight:600;font-size:12px;color:#8a9a93}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico.g{width:52px;height:52px;border-radius:16px}
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 16px}
.atalhos button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#c9c9cf}
.atalhos .ico{width:62px;height:62px;border-radius:20px;background:#151518;border:1px solid var(--borda)}
.atalhos button:active .ico{transform:scale(.94)}
.lista{display:flex;align-items:center;gap:14px}
.lista b.t{font-size:16.5px;font-weight:700;letter-spacing:-.015em;display:block}
.lista .d{color:var(--sub);font-size:13.5px;margin-top:2px}
.agua-bts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.agua-bts .btn{flex:1 1 0;min-width:64px;background:var(--bluebg);color:#4da3ff;font-weight:700}
.agua-bts .btn.sec{background:var(--card2);color:var(--txt)}
.tipo-ativ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tipo-ativ button{background:var(--card2);border:1.5px solid var(--borda);border-radius:20px;padding:12px 6px;text-align:center;font-weight:600;font-size:13.5px}
.tipo-ativ button.on{border-color:var(--ac);background:var(--acbg)}
.tipo-ativ .em{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;margin:0 auto 8px}
.mapa-ativ{height:230px;border-radius:16px;overflow:hidden;background:var(--card2);margin-top:4px}
.mapa-ativ .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.mapa-ativ .leaflet-control-attribution{font-size:10px;background:rgba(0,0,0,.6);color:#aaa}
.mapa-ativ .leaflet-control-attribution a{color:#ccc}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block;margin-right:6px}
.sync.pend{background:var(--warn)} .sync.erro{background:var(--red)} .sync.local{background:var(--mut)}
main#main{padding:4px 16px calc(var(--nav) + 40px + var(--safe-b))}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;border:1px solid var(--borda)}
.card.dois{background:var(--card2);border-radius:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-h h3{font-size:18px}
.link{color:var(--ac);font-weight:600;font-size:14px}
.lbl{font-size:13px;color:var(--sub)} .val{font-size:17px;font-weight:700;margin-bottom:8px}
.big{font-size:32px;font-weight:800;letter-spacing:-.035em}
.vazio{color:var(--sub);text-align:center;padding:22px 10px;font-size:14px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:700;background:var(--ac);color:#000;transition:transform .08s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.bl{width:100%}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--borda)}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--line)}
.btn.perigo{background:var(--redbg);color:var(--red)}
.btn.peq{padding:9px 13px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.mais{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center;flex:none}
.mais:active{transform:scale(.92)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card2);color:var(--sub);font-size:13px;font-weight:600;border:1px solid var(--borda);white-space:nowrap}
.chip.on{background:var(--acbg);color:var(--ac);border-color:rgba(0,208,132,.35)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:#0d0d0f;border:1px solid var(--borda);border-radius:999px;padding:5px;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:10px 12px;border-radius:999px;color:var(--sub);font-weight:600;font-size:13.5px;white-space:nowrap}
.seg button.on{background:var(--acbg);color:var(--ac);font-weight:700}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em;vertical-align:middle}
.badge.taco{background:var(--acbg);color:var(--ac)}
.badge.off{background:var(--bluebg);color:var(--blue)}
.badge.user{background:var(--card3);color:var(--sub)}
.badge.nf{background:var(--redbg);color:var(--red)}
.badge.warn{background:var(--warnbg);color:var(--warn)}

/* Semana */
.semana{display:flex;align-items:center;gap:4px;margin:6px 0 14px}
.semana .seta{width:26px;height:44px;color:var(--mut);display:grid;place-items:center;flex:none}
.semana .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}
.dia-b{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--sub)}
.dia-b .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--txt);border:2px solid var(--card3);position:relative}
.dia-b.hoje .n{border-color:var(--sub)}
.dia-b.ok .n{border-color:var(--ac);color:var(--ac)}
.dia-b.sel .n{background:var(--ac);border-color:var(--ac);color:#000}
.dia-b.fut{opacity:.45}
.dia-b .pt{position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--warn);background:var(--warnbg);padding:5px 10px;border-radius:999px;font-size:13px}

/* Anel e barras */
.anel{position:relative;flex:none}
.anel svg{display:block;transform:rotate(-90deg)}
.anel .meio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.anel .meio b{font-size:26px;font-weight:800;letter-spacing:-.04em}
.anel .meio span{font-size:12px;color:var(--sub)}
.barra{height:7px;border-radius:999px;background:var(--card3);overflow:hidden}
.barra>i{display:block;height:100%;border-radius:6px;background:var(--ac);transition:width .4s}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.macro .lbl{margin-bottom:6px}
.macro .q{font-size:12.5px;margin-top:6px;color:var(--sub)} .macro .q b{color:var(--txt)}

/* Listas */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .d{font-size:12.5px;color:var(--sub)}
.ref{background:var(--card);border-radius:22px;padding:16px 16px 16px 18px;margin-bottom:10px;border:1px solid var(--borda)}
.ref .itens{margin-top:10px;border-top:1px solid var(--line)}
.ref .itens .item{padding:10px 0}
.res-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.res-item:active{background:var(--card2)}

/* Nav inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,8,9,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav .in{max-width:560px;margin:0 auto;height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);font-weight:600}
.nav button.on{color:var(--ac)}
.nav .fab{width:60px;height:60px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center;margin:-28px auto 0;box-shadow:0 8px 28px rgba(0,208,132,.45);border:5px solid #000}
.nav .fab:active{transform:scale(.94)}

/* Sheets */
#sheets .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--borda);max-height:88vh;overflow-y:auto;padding:8px 16px calc(20px + var(--safe-b));max-width:560px;margin:0 auto;animation:sobe .22s ease-out;border-top:1px solid var(--line)}
.sheet.alto{height:92vh;max-height:92vh}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--card3);margin:4px auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-h h3{font-size:19px}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#f5f5f7;color:#000;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Tela de login */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 22px calc(32px + var(--safe-b));max-width:440px;margin:0 auto}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo .marca{width:52px;height:52px;border-radius:16px;background:var(--ac);display:grid;place-items:center;color:#000}
.logo b{font-size:26px;letter-spacing:-.02em} .logo b i{font-style:normal;color:var(--ac)}
.auth h1 span{color:var(--ac)}
.auth .aviso{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.erro-msg{color:var(--red);font-size:13.5px;min-height:20px;margin:4px 2px 10px}

/* Onboarding */
.passos{display:flex;gap:6px;margin-bottom:22px}
.passos i{flex:1;height:4px;border-radius:3px;background:var(--card3)}
.passos i.on{background:var(--ac)}
.opcao{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.opcao.on{border-color:var(--ac);background:var(--acbg)}
.opcao b{display:block} .opcao span{font-size:13px;color:var(--sub)}
.resumo-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resumo-meta div{background:var(--card2);border-radius:14px;padding:12px}
.resumo-meta b{display:block;font-size:20px}

/* Sessão de treino */
#full{position:fixed;inset:0;z-index:60;background:#000;overflow-y:auto}
#full .in{max-width:560px;margin:0 auto;padding:calc(10px + var(--safe-t)) 16px calc(150px + var(--safe-b))}
.prog{height:6px;background:var(--card3);border-radius:4px;overflow:hidden;margin:12px 0 8px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}
.ex-video{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1c1c1e,#0f2a20);border-radius:16px;padding:16px;margin:12px 0}
.ex-video .play{width:46px;height:46px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center;flex:none}
table.series{width:100%;border-collapse:separate;border-spacing:0 6px}
table.series th{font-size:12px;color:var(--sub);font-weight:600;text-align:center;padding:0 4px}
table.series td{text-align:center;padding:0 3px}
table.series td:first-child{font-weight:700;color:var(--sub);width:36px}
table.series input{text-align:center;padding:10px 4px;border-radius:10px}
table.series tr.ok input{border-color:rgba(0,208,132,.5);background:rgba(0,208,132,.08)}
.chk{width:42px;height:42px;border-radius:12px;border:2px solid var(--card3);display:grid;place-items:center;color:transparent;margin:0 auto}
tr.ok .chk{background:var(--ac);border-color:var(--ac);color:#000}
.ant{font-size:12px;color:var(--mut);white-space:nowrap}
.pr{color:var(--warn);font-size:12px}
.rodape-sessao{position:fixed;left:0;right:0;bottom:0;z-index:61;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}
.rodape-sessao .in2{max-width:560px;margin:0 auto;display:flex;gap:10px}
#descanso{position:fixed;left:0;right:0;bottom:0;z-index:65;padding:0 12px calc(12px + var(--safe-b))}
#descanso .box{max-width:536px;margin:0 auto;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:sobe .2s}
#descanso .tempo{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
#descanso .btn.sec{background:var(--card3)}
#descanso .btn.peq{padding:9px 10px}
#descanso .box{gap:10px;padding:12px}

/* Tabelas */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;min-width:100%;font-size:13px}
.tbl th,.tbl td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.tbl th{color:var(--sub);font-weight:600;background:var(--card)}

/* Gráficos */
.graf svg{width:100%;height:auto;display:block}
.graf text{fill:var(--mut);font-size:10px;font-family:inherit}
.vazio-graf{color:var(--sub);font-size:13.5px;text-align:center;padding:30px 10px;background:var(--card2);border-radius:14px}
.var-up{color:var(--ac)} .var-down{color:var(--red)} .var-neu{color:var(--sub)}

/* Fotos */
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fotos button{aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;background:var(--card2)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .dt{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);padding:2px 6px;border-radius:6px;font-size:11px}
.fotos button.sel{outline:3px solid var(--ac);outline-offset:-3px}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.comparar img{width:100%;border-radius:12px;display:block}

/* Conquistas */
.conq{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.conq div{background:var(--card);border-radius:20px;padding:14px 8px;text-align:center;border:1px solid var(--borda)}
.conq .em{font-size:30px;filter:grayscale(1);opacity:.35}
.conq .on .em{filter:none;opacity:1}
.conq b{display:block;font-size:12.5px;margin-top:6px}
.conq span{font-size:11px;color:var(--sub)}

/* Ocultar valores (ícone do olho) */
body.oculto .sens{filter:blur(7px);user-select:none}

/* Scanner */
.scanner{position:relative;border-radius:16px;overflow:hidden;background:#111;aspect-ratio:4/3}
.scanner video{width:100%;height:100%;object-fit:cover}
.scanner .mira{position:absolute;left:12%;right:12%;top:38%;height:24%;border:2px solid var(--ac);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

.boot{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:300}
.boot .marca{width:64px;height:64px;border-radius:20px;background:var(--ac);display:grid;place-items:center;color:#000;animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{transform:scale(.9);opacity:.7}}
@media (min-width:600px){ .sheet{border-radius:22px;bottom:16px} }

/* =====================================================================

// ---------- Utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (n, d = 0) => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const r1 = n => Math.round(n * 10) / 10;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hojeISO = () => iso(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDias = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const difDias = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const fmtData = s => { const d = parseISO(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fmtDataLonga = s => { const d = parseISO(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const DIAS_CURTO = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const DIAS_LONGO = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESES_LONGO = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const clone = o => JSON.parse(JSON.stringify(o));
const isoParaBr = s => { const [y, m, d] = String(s).split('-'); return d && m && y ? `${d}/${m}/${y}` : ''; };
// Formata "18051992" como "18/05/1992" enquanto digita e devolve a data em ISO (ou '' se ainda não é uma data válida)
function mascaraData(el) {
  const n = el.value.replace(/\D/g, '').slice(0, 8);
  const v = n.length > 4 ? `${n.slice(0, 2)}/${n.slice(2, 4)}/${n.slice(4)}` : n.length > 2 ? `${n.slice(0, 2)}/${n.slice(2)}` : n;
  if (el.value !== v) el.value = v;
  if (n.length !== 8) return '';
  const d = +n.slice(0, 2), m = +n.slice(2, 4), y = +n.slice(4), dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d || y < 1900 || iso(dt) > hojeISO()) return '';
  return iso(dt);
}
const fmtDur = ms => { const m = Math.round(ms / 60000); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${pad(m % 60)}`; };
const fmtCron = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); return (h ? h + ':' : '') + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); };
function tituloData(d) {
  const h = hojeISO();
  if (d === h) return 'Hoje';
  if (d === addDias(h, -1)) return 'Ontem';
  if (d === addDias(h, 1)) return 'Amanhã';
  const x = parseISO(d); return `${DIAS_CURTO[x.getDay()]}, ${x.getDate()} de ${MESES[x.getMonth()]}`;
}
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
async function baixar(blob, nome) {
  if (NATIVO && PLUG.Filesystem && PLUG.Share) { // No APK o WebView não baixa arquivos: salva e abre o menu de compartilhar
    try {
      const b64 = await new Promise((ok, erro) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = erro; r.readAsDataURL(blob); });
      const { uri } = await PLUG.Filesystem.writeFile({ path: nome, data: b64, directory: 'CACHE' });
      await PLUG.Share.share({ title: nome, url: uri, dialogTitle: 'Salvar ou enviar ' + nome });
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Não foi possível salvar o arquivo.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

};
const ic = (n, s = 22, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;

// ---------- Bases locais ----------
const TACO_IDX = (window.TACO || []).map(r => norm(r[1]));
const EX_BASE = (window.EXERCICIOS || []).map(([id, nome, grupo, equip]) => ({ id, nome, grupo, equip }));
const GRUPOS = window.GRUPOS || [];

// ---------- Estado ----------
const CFG = window.FIREBASE_CONFIG || {};
const MODO_NUVEM = !!(CFG.apiKey && CFG.projectId);
let fb = null;             // { auth, db }
let USER = null;           // { uid, email, nome }
let S = null;              // documento principal users/{uid}
let D = {};                // dias: { 'aaaa-mm-dd': { ref:{idRef:[itens]}, agua, supl:{} } }
let SESS = [];             // sessões de treino concluídas
let ATIV = [];             // atividades ao ar livre (caminhada, corrida, bike)
let FOTOS = null;          // carregadas sob demanda
let SA = null;             // sessão de treino em andamento
let VIEW = 'hoje';
let DIA = hojeISO();
const SUB = { treino: 'fichas', evo: 'corpo', modo: null, ritmo: 'corrida', dieta: 'diario' };

  { id: 'cafe', nome: 'Café da manhã', pct: 25 },
  { id: 'almoco', nome: 'Almoço', pct: 30 },
  { id: 'lanche', nome: 'Lanche da tarde', pct: 15 },
  { id: 'jantar', nome: 'Jantar', pct: 25 },
  { id: 'ceia', nome: 'Ceia', pct: 5 },
];
const COPOS_PADRAO = [250, 500, 600, 1000]; // botões de água (ml), configuráveis em Perfil
const padraoState = () => ({
  v: 1, perfil: null, metas: { auto: true }, refeicoes: clone(REFEICOES_PADRAO), fichas: [], exCustom: [], alimCustom: [],
  combos: [], pesos: [], medidas: [], suplementos: [], config: { som: true, vibrar: true, descanso: 60, ocultar: false, copos: clone(COPOS_PADRAO), metaKm: null, somarAtiv: false }, criadoEm: Date.now(),
});
function aplicar(o) {
  const p = padraoState(), s = (o && o.S) || {};
  S = { ...p, ...s, config: { ...p.config, ...(s.config || {}) }, metas: { ...p.metas, ...(s.metas || {}) } };
  if (!Array.isArray(S.config.copos) || !S.config.copos.length) S.config.copos = clone(COPOS_PADRAO);
  if (S.perfil && !S.perfil.estilo) S.perfil.estilo = 'ambos'; // contas antigas: mostra academia e ar livre
  D = (o && o.D) || {};
  SESS = ((o && o.SESS) || []).sort((a, b) => b.ini - a.ini);
  ATIV = ((o && o.ATIV) || []).sort((a, b) => b.ini - a.ini);
  document.body.classList.toggle('oculto', !!S.config.ocultar);
}

// ---------- Persistência ----------
const chaveCache = () => MODO_NUVEM ? 'gf_cache_' + USER.uid : 'gf_local';
const chaveSA = () => 'gf_sa_' + (USER ? USER.uid : 'x');
function cacheLocal() {
  try { localStorage.setItem(chaveCache(), JSON.stringify({ S, D, SESS, ATIV })); }
  catch (e) { if (!MODO_NUVEM) toast('Memória do navegador cheia: exporte um backup.'); }
}
const sync = { pend: new Set(), timer: null };
function setSync(est) {
  sync.estado = est;
  const el = $('#sync-dot'); if (!el) return;
  el.className = 'sync ' + (est === 'ok' ? '' : est);
  el.parentElement.title = { ok: 'Tudo salvo na nuvem', pend: 'Salvando…', erro: 'Sem conexão: salvo no aparelho, sincroniza quando voltar', local: 'Modo local: dados só neste aparelho' }[est];
}
function salvar(...chaves) {
  chaves.forEach(k => sync.pend.add(k));
  cacheLocal();
  if (!MODO_NUVEM) { sync.pend.clear(); setSync('local'); return; }
  setSync('pend');
  clearTimeout(sync.timer); sync.timer = setTimeout(flush, 700);
}
async function flush() {
  if (!MODO_NUVEM || !USER) return;
  const itens = [...sync.pend]; sync.pend.clear();
  const base = fb.db.collection('users').doc(USER.uid);
  try {
    await Promise.all(itens.map(k => {
      if (k === 'main') return base.set(clone(S));
      const i = k.indexOf(':'), t = k.slice(0, i), id = k.slice(i + 1);
      if (t === 'dia') return D[id] ? base.collection('dias').doc(id).set(clone(D[id])) : base.collection('dias').doc(id).delete();
      if (t === 'sess') { const s = SESS.find(x => x.id === id); return s ? base.collection('sessoes').doc(id).set(clone(s)) : base.collection('sessoes').doc(id).delete(); }
      if (t === 'ativ') { const a = ATIV.find(x => x.id === id); return a ? base.collection('atividades').doc(id).set(clone(a)) : base.collection('atividades').doc(id).delete(); }
      return null;
    }));
    if (!sync.pend.size) setSync('ok');
  } catch (e) {
    console.error('Erro ao salvar', e);
    itens.forEach(k => sync.pend.add(k)); setSync('erro');
    clearTimeout(sync.timer); sync.timer = setTimeout(flush, 8000);
  }
}
window.addEventListener('online', () => { if (sync.pend.size) flush(); });
async function carregar() {
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(chaveCache()) || 'null'); } catch (e) { }
  if (!MODO_NUVEM) { aplicar(cache); return; }
  try {
    const base = fb.db.collection('users').doc(USER.uid);
    const [m, dias, sess, ativ] = await Promise.all([base.get(), base.collection('dias').get(), base.collection('sessoes').get(), base.collection('atividades').get()]);
    const d = {}; dias.forEach(x => { d[x.id] = x.data(); });
    aplicar({ S: m.exists ? m.data() : null, D: d, SESS: sess.docs.map(x => x.data()), ATIV: ativ.docs.map(x => x.data()) });
    cacheLocal();
  } catch (e) {
    console.error(e); aplicar(cache);
    toast('Sem conexão: usando os dados salvos neste aparelho.');
  }
  try { SA = JSON.parse(localStorage.getItem(chaveSA()) || 'null'); } catch (e) { SA = null; }
}
function salvarSA() { try { SA ? localStorage.setItem(chaveSA(), JSON.stringify(SA)) : localStorage.removeItem(chaveSA()); } catch (e) { } }

// Fotos: subcoleção users/{uid}/fotos (nuvem) ou localStorage (modo local)
async function carregarFotos() {
  if (FOTOS) return FOTOS;
  if (MODO_NUVEM) {
    const q = await fb.db.collection('users').doc(USER.uid).collection('fotos').get();
    FOTOS = q.docs.map(x => x.data());
  } else {
    try { FOTOS = JSON.parse(localStorage.getItem('gf_fotos_local') || '[]'); } catch (e) { FOTOS = []; }
  }
  FOTOS.sort((a, b) => a.d < b.d ? 1 : -1);
  return FOTOS;
}
async function gravarFoto(f, apagar) {
  if (apagar) FOTOS = FOTOS.filter(x => x.id !== f.id); else { FOTOS.push(f); FOTOS.sort((a, b) => a.d < b.d ? 1 : -1); }
  if (MODO_NUVEM) {
    const ref = fb.db.collection('users').doc(USER.uid).collection('fotos').doc(f.id);
    return apagar ? ref.delete() : ref.set(f);

// ======================= CARDÁPIO (receitas + montador semanal) =======================
// Receitas em dados/receitas.js (ingredientes TACO em gramas); calorias sempre calculadas pela TACO.
const TACO_MAP = new Map((window.TACO || []).map(r => [r[0], r]));
const RECEITAS = window.RECEITAS || [], CLASSES_TROCA = window.CLASSES_TROCA || {}, CRU_DE = window.CRU_DE || {};
const GRUPOS_ALIM = [['ovo', '🥚 Ovo'], ['peixe', '🐟 Peixe'], ['carne', '🥩 Carne vermelha'], ['porco', '🐖 Porco'], ['frango', '🐔 Frango'], ['leite', '🥛 Leite e derivados'], ['vegetariano', '🥕 Vegetariano']];
const CARNES = ['peixe', 'carne', 'porco', 'frango'];
const prefs = () => S.prefs || { exclui: [], naoGosto: [] };
const kcal100 = id => (TACO_MAP.get(id) || [])[3] || 0;
const nomeTaco = id => (TACO_MAP.get(id) || [])[1] || String(id);
// Nome curto para a tela ("Frango, peito, sem pele, grelhado" → "Frango peito sem pele grelhado")
const nomeCurto = id => nomeTaco(id).replace(/, /g, ' ').replace(/\s+/g, ' ');
function grupoTaco(id) {
  const r = TACO_MAP.get(id); if (!r) return null;
  const n = norm(r[1]);
  if (r[2] === 8) return 'ovo';
  if (r[2] === 4) return 'peixe';
  if (n.includes('frango')) return 'frango';
  if (n.includes('porco')) return 'porco';
  if (r[2] === 5) return 'carne';
  if (r[2] === 6 || n.startsWith('manteiga')) return 'leite';
  return null;
}
function proibido(id) {
  const p = prefs(), g = grupoTaco(id);
  if (p.naoGosto.includes(id)) return true;
  if (g && p.exclui.includes(g)) return true;
  return p.exclui.includes('vegetariano') && CARNES.includes(g);
}
// Aplica as preferências: troca o que a pessoa não come por um item da mesma classe com as mesmas calorias
function resolverReceita(R) {
  const ing = [];
  for (const [id, g, cl] of R.ing) {
    if (!proibido(id)) { ing.push({ id, g }); continue; }
    const alt = cl && (CLASSES_TROCA[cl] || []).find(x => x !== id && !proibido(x) && kcal100(x));
    // mesmas calorias, mas no máximo 1,5x o peso (o ajuste da porção completa a meta)
    if (alt) { ing.push({ id: alt, g: Math.min(g * 1.5, g * kcal100(id) / kcal100(alt)), de: id }); continue; }
    if (cl) return null; // ingrediente principal sem troca possível: receita fora
    // tempero ou acompanhamento sem classe: só sai da receita
  }
  return ing.length ? ing : null;
}
const somaKcal = ing => ing.reduce((s, i) => s + kcal100(i.id) * i.g / 100, 0);
const arredG = g => g < 20 ? Math.max(1, Math.round(g)) : Math.round(g / 5) * 5;
// Porção da receita ajustada para a meta da refeição (de 0,5x a 2x da receita base)
function porcaoReceita(R, alvo) {
  const base = resolverReceita(R); if (!base) return null;
  const K = somaKcal(base); if (!K) return null;
  const f = Math.max(0.5, Math.min(2, (alvo || K) / K));
  const ing = base.map(i => ({ ...i, g: arredG(i.g * f) }));
  const t = { kcal: 0, p: 0, c: 0, g: 0 };
  for (const i of ing) { const r = TACO_MAP.get(i.id), q = porcao(alimentoTACO(r).por100, i.g); t.kcal += q.kcal || 0; t.p += q.p || 0; t.c += q.c || 0; t.g += q.g || 0; }
  return { R, ing, f, kcal: Math.round(t.kcal), p: Math.round(t.p), c: Math.round(t.c), gord: Math.round(t.g), trocas: ing.filter(i => i.de) };
}
// Tipo de cada refeição do usuário (inclusive as que ele criou e renomeou)
function tipoRef(ref) {
  if (ref.id === 'cafe') return 'cafe';
  if (ref.id === 'almoco' || ref.id === 'jantar') return 'principal';
  if (ref.id === 'lanche' || ref.id === 'ceia') return 'lanche';
  const n = norm(ref.nome);
  if (/cafe|manha|desjejum/.test(n)) return 'cafe';
  if (/almoc|jant/.test(n)) return 'principal';
  return (Number(ref.pct) || 0) >= 20 ? 'principal' : 'lanche';
}
const metaRef = ref => Math.round(metas().kcal * (Number(ref.pct) || 0) / 100);
const receitaPorId = id => RECEITAS.find(r => r.id === id);
const cardapioDaSemana = d => S.cardapio && d >= S.cardapio.ini && d <= addDias(S.cardapio.ini, 6);
// Escolhe a receita mais próxima da meta, variando (sorteio entre as 3 melhores) e evitando repetir
function escolherReceita(ref, alvo, evitar = [], usos = {}) {
  const tipo = tipoRef(ref);
  const cands = RECEITAS.filter(R => R.tipo === tipo).map(R => {
    const base = resolverReceita(R); if (!base) return null;
    const K = somaKcal(base); if (!K) return null;
    return { R, s: Math.abs(Math.log(alvo / K)) + 0.5 * (usos[R.id] || 0) + (evitar.includes(R.id) ? 3 : 0) };
  }).filter(Boolean).sort((a, b) => a.s - b.s);
  if (!cands.length) return null;
  return cands[Math.floor(Math.random() * Math.min(3, cands.length))].R.id;
}
function gerarSemana(ini) {
  const dias = {}, usos = {};
  for (let i = 0; i < 7; i++) {
    const d = addDias(ini, i), ontem = dias[addDias(d, -1)] || {}, hoje = {};
    for (const ref of S.refeicoes) {
      const rid = escolherReceita(ref, metaRef(ref), Object.values(ontem).concat(Object.values(hoje)), usos);
      if (rid) { hoje[ref.id] = rid; usos[rid] = (usos[rid] || 0) + 1; }
    }

// O cardápio cobre 7 dias a partir do dia em que foi montado; acabou, monta o próximo a partir de hoje
function garantirCardapio() {

}
// Receita sugerida para um dia e refeição (preenche o que faltar, ex.: refeição nova ou receita que ficou sem troca)
function sugestao(d, ref) {
  if (!cardapioDaSemana(d)) return null;
  const dia = S.cardapio.dias[d] || (S.cardapio.dias[d] = {});
  let R = receitaPorId(dia[ref.id]);
  if (!R || !resolverReceita(R)) {
    const rid = escolherReceita(ref, metaRef(ref), Object.values(dia));

const dicaDoDia = (tipo, d) => { const l = (window.DICAS_REFEICAO || {})[tipo] || []; return l.length ? l[(parseISO(d).getDate() + tipo.length) % l.length] : ''; };
const jaComeu = (d, refId) => !!(D[d] && D[d].card && D[d].card[refId]);
function comiReceita(d, refId) {
  const ref = S.refeicoes.find(r => r.id === refId), s = ref && sugestao(d, ref); if (!s) return;
  const antes = DIA; DIA = d;
  for (const i of s.ing) addItem(refId, alimentoTACO(TACO_MAP.get(i.id)), i.g);
  const dd = getDia(d); (dd.card = dd.card || {})[refId] = s.R.id; salvar('dia:' + d);

function listaCompras() {
  const tot = new Map();
  for (let i = 0; i < 7; i++) {
    const d = addDias(S.cardapio.ini, i);
    for (const ref of S.refeicoes) {
      const s = sugestao(d, ref); if (!s) continue;
      for (const it of s.ing) {
        const cru = CRU_DE[it.id], id = cru || it.id;
        const g = cru ? it.g * kcal100(it.id) / kcal100(cru) : it.g; // pronto → cru pela energia (TACO)
        tot.set(id, (tot.get(id) || 0) + g);
      }
    }
  }
  const cats = window.TACO_CATEGORIAS || [];
  const grupos = {};
  for (const [id, g] of tot) { const c = cats[(TACO_MAP.get(id) || [])[2]] || 'Outros'; (grupos[c] = grupos[c] || []).push({ id, g }); }
  for (const l of Object.values(grupos)) l.sort((a, b) => nomeTaco(a.id).localeCompare(nomeTaco(b.id)));
  return grupos;
}

// --- GPS (só no app Android): plugin nativo em Kotlin, android-recursos/java/.../gps ---
const GPS = NATIVO ? PLUG.GpsAtividade : null;
const GPSV = { aberta: false, timer: null, e: null }; // tela da atividade em andamento
async function iniciarGps(tipo) {
  if (!GPS) return abrirRegistrarAtiv(tipo);
  if (SA) { toast('Finalize o treino de academia antes.'); return; }
  try {
    let p = await GPS.permissao();
    if (!p.precisa) p = await GPS.pedirPermissao();
    if (!p.precisa) {
      toast(p.localizacao === 'granted' ? 'Ative a "localização precisa" do GymFlow nas configurações do Android.' : 'Sem permissão de localização não dá para medir pelo GPS.', 4500);
      return;
    }
    await permissaoNotificacao(); // a notificação mostra km e tempo com a tela desligada
    GPSV.e = await GPS.iniciar({ tipo, voz: S.config.vozKm !== false, pausaAuto: S.config.pausaAuto !== false });
    fecharTodas(); abrirTelaGps();
  } catch (e) { toast((e && e.message) || 'Não foi possível iniciar o GPS.', 4000); }
}
function abrirTelaGps() {
  GPSV.aberta = true;
  $('#full').classList.remove('hidden'); document.body.classList.add('travado');
  desenharTelaGps();
  clearInterval(GPSV.timer);
  GPSV.timer = setInterval(atualizarGps, 1000);
  atualizarGps();
}
function fecharTelaGps() {
  GPSV.aberta = false; clearInterval(GPSV.timer); GPSV.timer = null;

const barraParcial = (s, l) => { const mx = Math.max(...l), mn = Math.min(...l); const w = mx === mn ? 60 : 30 + 70 * (mx - s) / (mx - mn); return `<i style="display:inline-block;width:${Math.round(w)}px;height:6px;border-radius:3px;background:var(--ac);opacity:.7"></i>`; };
// Mapa do percurso: Leaflet + OpenStreetMap (carregados só quando precisa). Sem internet, desenha só o traçado.
let LEAFLET = null;
function carregarLeaflet() {
  if (LEAFLET) return LEAFLET;
  LEAFLET = new Promise((ok, erro) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    carregarScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js').then(ok, e => { LEAFLET = null; erro(e); });
  });
  return LEAFLET;
}
async function desenharMapa(pontos) {
  const el = $('#mapa-ativ'); if (!el || !pontos || pontos.length < 2) return;
  try {
    await carregarLeaflet();
    if (!el.isConnected) return;
    const L = window.L, m = L.map(el, { zoomControl: false, attributionControl: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
    const linha = L.polyline(pontos, { color: '#00d084', weight: 5 }).addTo(m);
    L.circleMarker(pontos[0], { radius: 6, color: '#fff', fillColor: '#00d084', fillOpacity: 1, weight: 2 }).addTo(m);
    L.circleMarker(pontos[pontos.length - 1], { radius: 6, color: '#fff', fillColor: '#ff453a', fillOpacity: 1, weight: 2 }).addTo(m);
    m.fitBounds(linha.getBounds(), { padding: [18, 18] });
  } catch (e) { // offline: só o traçado, sem o mapa de fundo
    const lats = pontos.map(p => p[0]), lons = pontos.map(p => p[1]);
    const a0 = Math.min(...lats), a1 = Math.max(...lats), o0 = Math.min(...lons), o1 = Math.max(...lons);
    const k = Math.cos((a0 + a1) / 2 * Math.PI / 180), W = 340, H = 220, esc_ = Math.min((W - 30) / (((o1 - o0) * k) || 1e-9), (H - 30) / ((a1 - a0) || 1e-9));
    const dx = (W - (o1 - o0) * k * esc_) / 2, dy = (H - (a1 - a0) * esc_) / 2; // centraliza o traçado
    const X = o => dx + (o - o0) * k * esc_, Y = a => H - dy - (a - a0) * esc_;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%"><path d="${pontos.map((p, i) => (i ? 'L' : 'M') + X(p[1]).toFixed(1) + ' ' + Y(p[0]).toFixed(1)).join(' ')}" fill="none" stroke="#00d084" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  }
}
// Ao abrir o app: volta para a atividade em andamento ou oferece salvar a que foi interrompida
async function retomarGpsAoAbrir() {
  if (!GPS) return;
  try {
    const e = await GPS.estado(); GPSV.e = e;
    if (e.ativo) { if (!GPSV.aberta) abrirTelaGps(); return; }
    const c = await GPS.copia();
    if (c && c.tipo && (c.movMs || 0) >= 10000) abrirResumoGps(c, true);
    else if (c && c.tipo) GPS.apagarCopia().catch(() => { });
  } catch (e) { }
}

function novoExSessao(exId, it = {}) {
  const ant = ultimaExec(exId), n = Number(it.series) || 3, cardio = ehCardio(exId);
  return {
    id: exId, alvo: it.reps || '', desc: Number(it.desc) || S.config.descanso, obs: it.obs || '',
    ant: ant ? ant.series.map(se => cardio ? { min: se.min, km: se.km } : { kg: se.kg, reps: se.reps }) : null,
    series: Array.from({ length: n }, (_, k) => {
      const a = ant && (ant.series[k] || ant.series[ant.series.length - 1]);
      return cardio ? { min: '', km: '', ok: false } : { kg: a ? a.kg : '', reps: '', ok: false };
    }),
  };
}

function recordesAtiv() {

    const p = a.parciais || [];

}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    h.setUint32(14, crc, true); h.setUint32(18, dt.length, true); h.setUint32(22, dt.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    partes.push(new Uint8Array(h.buffer), nm, dt);

    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, dt.length, true); c.setUint32(24, dt.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + dt.length;

async function restaurarBackup(file) {
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'GymFlow' || !j.S) throw new Error('Arquivo não é um backup do GymFlow.');
    if (!(await confirmar('Substituir TODOS os dados atuais pelo backup de ' + (j.exportadoEm || '').slice(0, 10).split('-').reverse().join('/') + '?', 'Restaurar'))) return;
    const antigosDias = Object.keys(D), antigasSess = SESS.map(s => s.id), antigasAtiv = ATIV.map(a => a.id);
    aplicar({ S: j.S, D: j.D || {}, SESS: j.SESS || [], ATIV: j.ATIV || [] });
    const chDias = [...new Set(antigosDias.concat(Object.keys(D)))].map(d => 'dia:' + d);
    const chSess = [...new Set(antigasSess.concat(SESS.map(s => s.id)))].map(id => 'sess:' + id);
    const chAtiv = [...new Set(antigasAtiv.concat(ATIV.map(a => a.id)))].map(id => 'ativ:' + id);
    salvar('main', ...chDias, ...chSess, ...chAtiv);
    render(); toast('Backup restaurado!');
  } catch (e) { toast(e.message || 'Arquivo inválido.'); }
}

function comprimirImagem(file, max = 900, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Imagem inválida')); };
    img.src = url;
  });
}

  minimizarSessao: () => fecharSessaoTela(),
  saIr: ds => { const i = Number(ds.i); if (i < 0 || i >= SA.ex.length) return; SA.idx = i; salvarSA(); pararDescanso(true); desenharSessao(); $('#full').scrollTo(0, 0); },
  saCheck: ds => checarSerie(Number(ds.i)),
  saSerieMais: () => { const ex = SA.ex[SA.idx], u = ex.series[ex.series.length - 1] || {}; ex.series.push(ehCardio(ex.id) ? { min: '', km: '', ok: false } : { kg: u.kg ?? '', reps: '', ok: false }); salvarSA(); desenharSessao(); },
  saSerieMenos: () => { const ex = SA.ex[SA.idx]; if (ex.series.length > 1) ex.series.pop(); salvarSA(); desenharSessao(); },
  saTrocar: () => abrirPickerEx(id => { const at = SA.ex[SA.idx]; SA.ex[SA.idx] = novoExSessao(id, { series: at.series.length, reps: at.alvo, desc: at.desc }); salvarSA(); desenharSessao(); }),
  saDescansoCfg: () => abrirSheet({ render: () => `${cabecalho('Descanso deste exercício')}<div class="chips" style="flex-wrap:wrap">${[0, 30, 45, 60, 75, 90, 120, 150, 180, 240].map(v => `<button class="chip ${SA.ex[SA.idx].desc === v ? 'on' : ''}" data-act="saDescansoSet" data-v="${v}">${v ? v + ' s' : 'Sem descanso'}</button>`).join('')}</div>` }),
  saDescansoSet: ds => { SA.ex[SA.idx].desc = Number(ds.v); salvarSA(); fecharSheet(); desenharSessao(); },
  menuSessao: () => abrirSheet({
    render: () => `${cabecalho('Opções do treino')}
      <button class="item" style="width:100%" data-act="saAddEx">${ic('mais', 20)}<div class="grow" style="text-align:left"><div class="t">Adicionar exercício</div></div></button>
      <button class="item" style="width:100%" data-act="saObs">${ic('nota', 20)}<div class="grow" style="text-align:left"><div class="t">Anotação neste exercício</div></div></button>
      <button class="item" style="width:100%" data-act="saRemoverEx">${ic('x', 20)}<div class="grow" style="text-align:left"><div class="t">Pular/remover este exercício</div></div></button>
      <button class="item" style="width:100%" data-act="finalizarSessao">${ic('check', 20)}<div class="grow" style="text-align:left"><div class="t">Finalizar treino</div></div></button>
      <button class="item red" style="width:100%" data-act="descartarSessao">${ic('lixo', 20)}<div class="grow" style="text-align:left"><div class="t">Descartar treino</div></div></button>`,
  }),
  saAddEx: () => { fecharSheet(); abrirPickerEx(id => { SA.ex.push(novoExSessao(id, { desc: S.config.descanso })); SA.idx = SA.ex.length - 1; salvarSA(); desenharSessao(); }); },
  saObs: () => { fecharSheet(); const ex = SA.ex[SA.idx]; const t = prompt('Anotação para ' + exPorId(ex.id).nome + ':', ex.obs || ''); if (t != null) { ex.obs = t.trim(); salvarSA(); desenharSessao(); } },
  saRemoverEx: async () => { fecharSheet(); if (SA.ex.length <= 1) { toast('O treino precisa de pelo menos 1 exercício.'); return; } if (!(await confirmar('Remover "' + exPorId(SA.ex[SA.idx].id).nome + '" deste treino?', 'Remover'))) return; SA.ex.splice(SA.idx, 1); SA.idx = Math.min(SA.idx, SA.ex.length - 1); salvarSA(); desenharSessao(); },
  descartarSessao: async () => { fecharTodas(); if (await confirmar('Descartar o treino em andamento? Nada será salvo.', 'Descartar')) descartarSessao(); },
  finalizarSessao: () => { fecharTodas(); pararDescanso(true); abrirFinalizar(); },
  saNota: ds => { topo().st.nota = Number(ds.v); redesenharSheet(); },
  salvarSessao: () => {
    const st = topo().st, s = montarSessaoFinal(); s.nota = st.nota || null; s.notas = st.notas.trim();
    SESS.unshift(s); SESS.sort((a, b) => b.ini - a.ini); SA = null; salvarSA(); salvar('sess:' + s.id);
    fecharTodas(); fecharSessaoTela(); VIEW = 'hoje'; DIA = hojeISO(); render(); toast('Treino salvo! 🔥');
  },
  rtAjuste: ds => { if (!RT) return; RT.fim += Number(ds.v) * 1000; RT.total = Math.max(1, RT.total + Number(ds.v)); tickDescanso(); },
  rtPular: () => pararDescanso(),
  // --- evolução ---
  periodo: ds => { PERIODO = Number(ds.v); render(); },
  registrarPeso: () => abrirPeso(),
  salvarPeso: () => {
    const st = topo().st, kg = num(st.kg); if (!kg || kg < 20 || kg > 400) { toast('Peso inválido.'); return; }
    S.pesos = S.pesos.filter(p => p.d !== st.d).concat({ d: st.d, kg: r1(kg) });
    salvar('main'); fecharSheet(); render(); toast('Peso registrado' + (S.metas.auto ? ' · metas recalculadas' : ''));
  },
  apagarPeso: async ds => { if (S.pesos.length <= 1) { toast('Mantenha pelo menos uma pesagem.'); return; } if (!(await confirmar('Apagar a pesagem de ' + fmtDataLonga(ds.d) + '?', 'Apagar'))) return; S.pesos = S.pesos.filter(p => p.d !== ds.d); salvar('main'); render(); },
  registrarMedidas: () => abrirMedidas(),
  salvarMedidas: () => {
    const st = topo().st, r = { d: st.d }; let n = 0;
    for (const [k] of MEDIDAS) { const v = num(st[k]); if (v != null && v > 0) { r[k] = v; n++; } }
    if (!n) { toast('Preencha pelo menos uma medida.'); return; }
    const ex = S.medidas.find(m => m.d === st.d);
    S.medidas = S.medidas.filter(m => m.d !== st.d).concat(ex ? { ...ex, ...r } : r);
    salvar('main'); fecharSheet(); SUB.evo = 'medidas'; VIEW = 'evo'; render(); toast('Medidas salvas');
  },
  apagarMedida: async ds => { if (!(await confirmar('Apagar as medidas de ' + fmtDataLonga(ds.d) + '?', 'Apagar'))) return; S.medidas = S.medidas.filter(m => m.d !== ds.d); salvar('main'); render(); },
  novaFoto: () => $('#arquivo-foto').click(),
  novaFotoFab: () => { VIEW = 'evo'; SUB.evo = 'fotos'; render(); $('#arquivo-foto').click(); },
  modoComparar: () => { const st = desenharFotos.st; st.comparar = !st.comparar; st.sel = []; desenharFotos(); },
  verFoto: async ds => {
    const st = desenharFotos.st;
    if (st.comparar) {
      st.sel = st.sel.includes(ds.id) ? st.sel.filter(x => x !== ds.id) : st.sel.concat(ds.id).slice(-2);
      if (st.sel.length === 2) {
        const [a, b] = st.sel.map(id => FOTOS.find(f => f.id === id)).sort((x, y) => x.d < y.d ? -1 : 1);
        abrirSheet({ cls: 'alto', render: () => `${cabecalho('Antes e depois')}<div class="comparar"><div><img src="${a.img}" alt=""><div class="small c mt">${fmtDataLonga(a.d)}</div></div><div><img src="${b.img}" alt=""><div class="small c mt">${fmtDataLonga(b.d)}</div></div></div><p class="c sub mt">${difDias(a.d, b.d)} dias de diferença</p>`, aoFechar: () => { st.comparar = false; st.sel = []; desenharFotos(); } });
      } else desenharFotos();
      return;
    }
    const f = FOTOS.find(x => x.id === ds.id);
    abrirSheet({ cls: 'alto', render: () => `${cabecalho(fmtDataLonga(f.d))}<img src="${f.img}" alt="" style="width:100%;border-radius:14px"><button class="btn perigo bl mt" data-act="apagarFoto" data-id="${f.id}">${ic('lixo', 18)} Apagar foto</button>` });
  },
  apagarFoto: async ds => { if (!(await confirmar('Apagar esta foto?', 'Apagar'))) return; const f = FOTOS.find(x => x.id === ds.id); try { await gravarFoto(f, true); } catch (e) { toast('Erro ao apagar.'); } fecharTodas(); desenharFotos(); },
  // --- perfil ---
  editarPerfil: () => abrirEditarPerfil(),
  salvarPerfil: () => {
    const st = topo().st;
    st.altura = num(st.altura); st.metaPeso = num(st.metaPeso); st.atividade = Number(st.atividade);
    if (!st.nome.trim() || !st.altura || st.altura < 120 || st.altura > 230 || !st.nasc) { toast('Confira nome, altura e nascimento.'); return; }
    S.perfil = { ...S.perfil, ...st, nome: st.nome.trim() }; SUB.modo = null; salvar('main'); fecharSheet(); render(); toast('Perfil atualizado');
  },
  editarMetas: () => abrirEditarMetas(),
  metasModo: ds => { topo().st.auto = ds.v === '1'; redesenharSheet(); },
  salvarMetas: () => {
    const st = topo().st;
    if (st.auto) S.metas = { auto: true };
    else {
      const m = { auto: false, prot: num(st.prot), carb: num(st.carb), gord: num(st.gord), agua: num(st.agua), fibra: num(st.fibra) };
      if (![m.prot, m.carb, m.gord].every(v => v != null && v >= 0) || m.prot * 4 + m.carb * 4 + m.gord * 9 < 800) { toast('Confira os macros (mínimo de 800 kcal).'); return; }
      S.metas = m;
    }
    salvar('main'); fecharSheet(); render(); toast('Metas salvas');
  },
  editarRefeicoes: () => abrirEditarRefeicoes(),
  refRemover: ds => { topo().st.l.splice(Number(ds.i), 1); redesenharSheet(); },
  refAdd: () => { topo().st.l.push({ id: 'r' + novoId(), nome: 'Nova refeição', pct: 0 }); redesenharSheet(); },
  salvarRefeicoes: () => {
    const l = topo().st.l.map(r => ({ ...r, nome: r.nome.trim() || 'Refeição', pct: Number(r.pct) || 0 }));
    S.refeicoes = l; salvar('main'); fecharSheet(); render(); toast('Refeições salvas');
  },
  editarSupl: ds => abrirEditarSupl(ds.id),
  salvarSupl: () => {
    const st = topo().st; if (!st.nome.trim()) { toast('Digite o nome.'); return; }
    const s = { id: st.id, nome: st.nome.trim(), dose: (st.dose || '').trim(), estoque: num(st.estoque), alerta: num(st.alerta) ?? 5 };
    const i = S.suplementos.findIndex(x => x.id === s.id); i >= 0 ? S.suplementos[i] = s : S.suplementos.push(s);
    salvar('main'); fecharSheet(); redesenharSheet(); render();
  },
  apagarSupl: async ds => { if (!(await confirmar('Apagar este suplemento?', 'Apagar'))) return; S.suplementos = S.suplementos.filter(x => x.id !== ds.id); salvar('main'); fecharSheet(); redesenharSheet(); render(); },
  config: () => abrirConfig(),
  cfgToggle: ds => { S.config[ds.k] = !S.config[ds.k]; salvar('main'); redesenharSheet(); render(); },
  atualizarApp: () => { if (ATUALIZACAO) location.href = ATUALIZACAO.url; },
  exportarExcel: () => exportarExcel(),
  backup: () => baixarBackup(),
  restaurar: () => $('#arquivo-backup').click(),
  instalar: async () => { if (!INSTALAR) return; INSTALAR.prompt(); await INSTALAR.userChoice; INSTALAR = null; render(); },
  sair: async () => {
    if (!(await confirmar(MODO_NUVEM ? 'Sair da sua conta neste aparelho?' : 'Sair do modo local? Seus dados continuam salvos neste navegador.', 'Sair'))) return;
    fecharTodas(); pararDescanso(true); FOTOS = null; SA = null;
    if (MODO_NUVEM) { await flush(); await fb.auth.signOut(); } else { localStorage.removeItem('gf_local_ativo'); mostrarAuth(); }
  },
};

// ======================= CAMPOS (digitação) =======================
const I = {
  addRef: (ds, el) => { topo().st.ref = el.value; },
  buscaAlim: (ds, el) => { const st = topo().st; st.q = el.value; $('#res-alim').innerHTML = resultadosAlim(st); },
  qtdG: (ds, el) => { const t = topo(); t.st.g = el.value; $('#qtd-prev').innerHTML = t.prev(); },
  qtdRef: (ds, el) => { topo().st.ref = el.value; },
  novoAlim: (ds, el) => { topo().st[ds.k] = el.value; },
  fichaNome: (ds, el) => { topo().st.nome = el.value; },
  fichaItem: (ds, el) => { topo().st.itens[Number(ds.i)][ds.k] = el.value; },
  buscaExLib: (ds, el) => { FILTRO_EX.q = el.value; $('#lista-ex').innerHTML = listaExHTML(FILTRO_EX, 'verExercicio'); },
  buscaPick: (ds, el) => { const t = topo(); t.f.q = el.value; $('#lista-pick').innerHTML = listaExHTML(t.f, 'pickEx'); },
  novoEx: (ds, el) => { topo().st[ds.k] = el.value; },
  saSerie: (ds, el) => { const s = SA.ex[SA.idx].series[Number(ds.i)]; s[ds.k] = el.value === '' ? '' : num(el.value); salvarSA(); },
  saNotas: (ds, el) => { topo().st.notas = el.value; },
  exCarga: (ds, el) => { SUB.exCarga = el.value; render(); },
  pesoCampo: (ds, el) => { topo().st[ds.k] = el.value; },
  medCampo: (ds, el) => { topo().st[ds.k] = el.value; },
  perfilCampo: (ds, el) => { topo().st[ds.k] = el.value; },
  metaCampo: (ds, el) => { const t = topo(); t.st[ds.k] = el.value; const k = $('#meta-kcal'); if (k) k.textContent = t.kc() + ' kcal'; },
  refCampo: (ds, el) => { const st = topo().st; st.l[Number(ds.i)][ds.k] = el.value; const s = st.l.reduce((a, r) => a + (Number(r.pct) || 0), 0), e = $('#ref-soma'); if (e) { e.textContent = `Soma: ${s}% ${s === 100 ? '✓' : '(o ideal é 100%)'}`; e.className = 'small mb ' + (s === 100 ? 'ac' : 'warn'); } },
  suplCampo: (ds, el) => { topo().st[ds.k] = el.value; },
  ativCampo: (ds, el) => { const t = topo(); t.st[ds.k] = el.value; const p = $('#ativ-prev'); if (p) p.innerHTML = t.prev(); },
  cfgAtivCampo: (ds, el) => { topo().st[ds.k] = el.value; },
  aguaCampo: (ds, el) => { topo().st.ml = el.value; },
  gpsNotas: (ds, el) => { topo().st.notas = el.value; },
  coposCampo: (ds, el) => { topo().st.l[Number(ds.i)] = el.value; },
  cfgDescanso: (ds, el) => { S.config.descanso = Number(el.value); salvar('main'); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.dataset.fab) fecharSheet();
  try { fn(t.dataset, t, e); } catch (err) { console.error(err); toast('Ops: ' + err.message); }
});
const aoDigitar = e => {
  const t = e.target;
  if (t.dataset.nasc) { // data digitada: dd/mm/aaaa com as barras entrando sozinhas
    const isoNasc = mascaraData(t);
    if (t.dataset.nasc === 'ob') { OB.p.nasc = isoNasc; OB.p.nascTxt = t.value; } else topo().st.nasc = isoNasc;
    return;
  }
  if (t.dataset.ob !== undefined) { OB.p[t.dataset.ob] = t.value; return; }
  const k = t.dataset.in; if (k && I[k]) I[k](t.dataset, t, e);
};
document.addEventListener('input', aoDigitar);
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') aoDigitar(e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'scan-cod') buscarCodigo(e.target.value);
  if (e.key === 'Enter' && e.target.id === 'agua-ml') A.aguaOutroOk();
  if (e.key === 'Escape' && PILHA.length) fecharSheet();
});
$('#arquivo-foto').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    toast('Salvando foto…');
    const img = await comprimirImagem(f);
    await carregarFotos();
    await gravarFoto({ id: novoId(), d: hojeISO(), img });
    VIEW = 'evo'; SUB.evo = 'fotos'; render(); toast('Foto salva 📸');
  } catch (err) { toast(err.message || 'Não foi possível salvar a foto.'); }
});
$('#arquivo-backup').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) restaurarBackup(f); });

// ======================= APP ANDROID =======================
async function permissaoNotificacao() {
  const LN = PLUG.LocalNotifications; if (!LN) return false;
  try { let p = await LN.checkPermissions(); if (p.display === 'prompt' || p.display === 'prompt-with-rationale') p = await LN.requestPermissions(); return p.display === 'granted'; } catch (e) { return false; }
}
// Com a tela desligada o cronômetro do WebView para: agenda uma notificação para o fim do descanso
async function agendarAvisoDescanso() {
  const LN = PLUG.LocalNotifications; if (!LN || !RT || RT.fim - Date.now() < 2000) return;
  if (!(await permissaoNotificacao())) return;
  try { await LN.schedule({ notifications: [{ id: 7001, title: 'Descanso acabou ⏱', body: 'Bora para a próxima série 💪', schedule: { at: new Date(RT.fim), allowWhileIdle: true } }] }); } catch (e) { }
}
function cancelarAvisoDescanso() { const LN = PLUG.LocalNotifications; if (LN) LN.cancel({ notifications: [{ id: 7001 }] }).catch(() => { }); }
// Aviso de APK novo. Confere a cada 15 minutos (e ao voltar para o app).
async function verificarAtualizacao() {
  if (!NATIVO || !PLUG.App) return;
  try {
    const info = await PLUG.App.getInfo(); VERSAO_APP = info.version;
    // Vale nos dois modos: no online as telas já se atualizam pela Vercel, mas o código nativo (GPS) só muda com APK novo
    let rel = null; try { rel = JSON.parse(localStorage.getItem('gf_upd') || 'null'); } catch (e) { }
    if (!rel || Date.now() - rel.ts > 15 * 60e3) {
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } });
      if (!r.ok) return;
      const j = await r.json(), apk = (j.assets || []).find(a => /\.apk$/i.test(a.name));
      rel = { ts: Date.now(), tag: j.tag_name, url: apk ? apk.browser_download_url : j.html_url };
      localStorage.setItem('gf_upd', JSON.stringify(rel));
    }
    const nova = parseInt(String(rel.tag).split('.').pop(), 10), atual = parseInt(info.build, 10);
    const antes = !!ATUALIZACAO;
    ATUALIZACAO = nova > atual ? { versao: String(rel.tag).replace(/^v/, ''), url: rel.url } : null;
    if (!!ATUALIZACAO !== antes && S && S.perfil) render();
  } catch (e) { }
}
function configurarNativo() {
  if (!NATIVO) return;
  document.documentElement.classList.add('nativo');
  const App = PLUG.App;
  if (App) {
    App.addListener('backButton', () => {
      if (PILHA.length) return fecharSheet();
      if (GPSV.aberta) return fecharTelaGps();
      if (!$('#full').classList.contains('hidden')) return fecharSessaoTela();
      if (OB && OB.passo > 0) return A.obVoltar();
      if (S && S.perfil && !$('#app').classList.contains('hidden') && VIEW !== 'hoje') { VIEW = 'hoje'; render(); window.scrollTo(0, 0); return; }
      App.minimizeApp ? App.minimizeApp() : App.exitApp();
    });
    App.addListener('pause', () => { agendarAvisoDescanso(); });
    App.addListener('resume', () => { cancelarAvisoDescanso(); if (RT) tickDescanso(); verificarAtualizacao(); if (GPS && S && S.perfil) atualizarGps().then(() => { if (!GPSV.aberta && VIEW !== 'perfil') render(); }); });
  }
  verificarAtualizacao();
}

// ======================= INICIALIZAÇÃO =======================
let INSTALAR = null, NOME_CADASTRO = '';
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALAR = e; if (VIEW === 'perfil' && S) render(); });
function carregarScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar ' + src)); document.head.appendChild(s); }); }
async function iniciar() {
  configurarNativo();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (!MODO_NUVEM) {
    if (localStorage.getItem('gf_local_ativo')) await A.entrarLocal(); else mostrarAuth();
    return;
  }
  try {
    const v = '10.12.2';
    await carregarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
    await Promise.all([carregarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`), carregarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`)]);
  } catch (e) {
    $('#boot').classList.add('hidden');
    $('#auth').innerHTML = `<div class="auth">${LOGO}<h2>Sem conexão</h2><p class="sub">Não foi possível carregar o login. Verifique a internet e tente de novo.</p><button class="btn bl mt" onclick="location.reload()">Tentar novamente</button></div>`;
    return;
  }
  firebase.initializeApp(CFG);
  fb = { auth: firebase.auth(), db: firebase.firestore() };
  fb.db.enablePersistence({ synchronizeTabs: true }).catch(() => { });
  fb.auth.onAuthStateChanged(async u => {
    if (u) {
      USER = { uid: u.uid, email: u.email, nome: u.displayName || NOME_CADASTRO };
      await carregar(); entrarApp();
    } else { USER = null; S = null; D = {}; SESS = []; ATIV = []; $('#app').classList.add('hidden'); mostrarAuth('entrar'); }
  });
}
// Ao voltar para o app num novo dia, a tela Hoje passa para a data atual
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S && S.perfil) { const h = hojeISO(); if (iniciar.hoje && iniciar.hoje !== h) { DIA = h; render(); } iniciar.hoje = h; }
});
iniciar.hoje = hojeISO();
iniciar();
